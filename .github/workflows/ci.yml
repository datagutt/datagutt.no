name: CI

on:
  push:
    branches: [master, game, kai]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      # Next, Playwright and the asset scripts run on Node.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - run: bun run turbo run lint typecheck test world:check
      - run: bunx playwright install --with-deps chromium
        working-directory: apps/datagutt
      # No access to the private art repo here: this builds and plays the game with
      # placeholder art, which is exactly what a fresh clone gets.
      - run: bun run turbo run test:e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/*/test-results/
          retention-days: 7
